<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hail Caesar Army Builder</title>
<style>
:root{--bg:#f4efe4;--card:#fffdf7;--ink:#2b2418;--mut:#7a6f5a;--ac:#8c1c13;--ok:#2e7d32;--bad:#c62828;--warn:#b26a00;--ln:#d8cfba}
@media(prefers-color-scheme:dark){:root{--bg:#1d1a14;--card:#27231a;--ink:#eee6d3;--mut:#a89f88;--ac:#e0705f;--ok:#7bc47f;--bad:#ff7b72;--warn:#f0b050;--ln:#40392b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 Georgia,serif}
header{background:var(--ac);color:#fff;padding:10px 16px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
header h1{font-size:18px;margin:0;flex:1 1 100%}
header label{font-size:12px;display:flex;flex-direction:column;gap:2px}
select,input,button{font:inherit;padding:4px 6px;border:1px solid var(--ln);border-radius:4px;background:var(--card);color:var(--ink)}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
header select{min-width:260px}
main{display:grid;grid-template-columns:1fr 340px;gap:12px;padding:12px;max-width:1400px;margin:auto}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--ln);border-radius:6px;padding:10px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 6px;color:var(--ac)}h3{font-size:13px;margin:8px 0 4px}
.desc{color:var(--mut);font-size:12px}
table{width:100%;border-collapse:collapse}td,th{padding:3px 4px;border-bottom:1px solid var(--ln);vertical-align:top;text-align:left}
th{font-size:11px;color:var(--mut)}tr.up td:first-child{padding-left:22px}tr.up2 td:first-child{padding-left:40px}
.st{font:11px monospace;color:var(--mut);white-space:nowrap}.sp{font-size:11px;color:var(--ac)}.lim{font-size:11px;color:var(--warn)}
.q{white-space:nowrap}.q button{width:24px;padding:2px}.q span{display:inline-block;min-width:22px;text-align:center}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.man{color:var(--mut)}
ul.v{list-style:none;padding:0;margin:0}ul.v li{padding:3px 0;border-bottom:1px dotted var(--ln);font-size:12.5px}
.bar{height:8px;background:var(--ln);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}.bar.over i{background:var(--bad)}
.dh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}.dh input[type=text]{width:140px}
.side{position:sticky;top:8px;align-self:start;max-height:calc(100vh - 16px);overflow:auto}
#pv{display:none}
@media print{header,main{display:none!important}#pv{display:block;color:#000;background:#fff;padding:8px}#pv table{margin-bottom:12px}#pv td,#pv th{border-bottom:1px solid #999}#pv h1{font-size:20px;margin:0}#pv h2{color:#000;border-bottom:2px solid #000;margin-top:14px}body{background:#fff}}
</style></head><body>
<header><h1>Hail Caesar Army Builder <small style="font-weight:normal;opacity:.8">· Biblical, Classical, Late Antiquity &amp; Early Medieval army lists</small></h1>
<label>Army<select id="army"></select></label>
<label>Points limit (0 = none)<input id="limit" type="number" min="0" step="25" value="300" style="width:130px"></label>
<button id="addDiv" class="p">+ Add division</button><button id="clr">Clear</button><button id="copy">Copy list</button><button id="prt">Print</button>
</header>
<main><section id="divs"></section><aside class="side"><div class="card" id="sum"></div><div class="card" id="val"></div><div class="card" id="info"></div></aside></main>
<div id="pv"></div>

 if(!r.cats.length&&{ninf:['infantry'],cav:['cavalry'],skirm:['skirmisher'],mounted:['cavalry','chariot']}[den])r.cats=({ninf:['infantry'],cav:['cavalry'],skirm:['skirmisher'],mounted:['cavalry','chariot']})[den];
 r.cond=/\bif\b[^.]*\b(fielded|included|present)\b|if included|if present/i.test(L+' '+T);
 r.den=den;return r}
const SYN={archer:['archer','bow'],javelin:['javelin'],spearmen:['spear'],spearman:['spear'],slinger:['sling'],bowmen:['bow']};
function tokHit(u,t){let b=t.replace(/s$/,'');let a=SYN[b]||SYN[t]||[b.length>5?b.slice(0,b.length-2):b];return a.some(x=>u.txt.includes(x))}
function matchU(u,r){return mRow(u,r,u.txt)}
function mRow(u,r,txt){if(u.lvl||u.sub)return false;return mTxt(u,r,txt)}
function mTxt(u,r,txt){const hit=t=>{let b=t.replace(/s$/,'');let a=SYN[b]||SYN[t]||[b.length>5?b.slice(0,b.length-2):b];return a.some(x=>txt.includes(x))};
 if(r.cats.length){if(!r.cats.some(c=>u.cat==c))return false}
 let mh=r.mods.length?r.mods.some(m=>txt.includes(m)):null,th=r.toks.length?r.toks.some(hit):null;
 if(mh!==null&&th!==null){if(r.slash?!(mh||th):!(mh&&th))return false}else if(mh===false||th===false)return false;
 if(r.rx&&!r.rx.test(txt))return false;return true}
function _old(u,r){if(u.lvl||u.sub)return false;
 if(r.cats.length){if(!r.cats.some(c=>u.cat==c))return false}
 if(r.mods.length&&!r.mods.some(m=>u.txt.includes(m)))return false;
 if(r.rx&&!r.rx.test(u.txt))return false;
 if(r.toks.length&&!r.toks.some(t=>u.txt.includes(t.length>6?t.slice(0,t.length-2):t.replace(/s$/,''))))return false;return true}
function denSet(den,r){return u=>{if(u.lvl||u.sub)return false;
 if(den=='all')return true;if(den=='ninf')return u.cat=='infantry';if(den=='cav')return u.cat=='cavalry';if(den=='mounted')return u.cat=='cavalry'||u.cat=='chariot';if(den=='skirm')return u.cat=='skirmisher';
 let w=den.slice(3).split(/[ \/]+/).filter(x=>x&&!STOP.has(x)).map(x=>x.replace(/s$/,''));return w.some(t=>u.txt.includes(t.length>6?t.slice(0,t.length-2):t))}}
function nq(t,r){let n=0;A.U.forEach(b=>{if(b.lvl||b.sub)return;let q=t.by[b.id]||0;if(!q)return;if(mTxt(b,r,b.txt))n+=q;else if(r.toks.length||r.mods.length){A.U.forEach(x=>{if(x.lvl==1&&x.base==b&&mTxt(b,r,(x.d+' '+x.sp).toLowerCase()))n+=Math.min(t.by[x.id]||0,q)})}});return n}
function qty(t,f){let n=0;A.U.forEach(u=>{if(f(u))n+=t.by[u.id]||0});return n}
function evalRules(t){let out=[];
 A.rules.forEach(r=>{let c=r.c;
  let am=c.text.match(/at least three ([a-z ]+?) units(?: in the army)? for every artillery/i);
  if(am){let ks=am[1].toLowerCase().split(/ or /).map(x=>x.trim().replace(/ies$/,'y').replace(/s$/,'')),leg=qty(t,u=>!u.lvl&&!u.sub&&u.cat!='artillery'&&ks.some(k=>u.txt.includes(k.length>6?k.slice(0,k.length-2):k))),ar=qty(t,u=>u.cat=='artillery'&&!u.lvl),la=qty(t,u=>u.cat=='artillery'&&!u.lvl&&/light/.test(u.txt)&&!/medium|heavy/.test(u.d.toLowerCase())),ma=ar-la;
   let ok=leg>=3*ar&&ma<=la;out.push({s:t.n==0?'man':ok?'ok':'bad',t:`${c.label}: ${leg} ${am[1]} / ${ar} artillery (need 3:1; heavy+medium ≤ light: ${ma} vs ${la})`,x:c.text});return}
  if(r.manual){out.push({s:'man',t:`${c.label} – check manually`,x:c.text});return}
  let ds=denSet(r.den),dq=qty(t,ds),sq=nq(t,r),exists=A.U.some(u=>matchU(u,r)||(u.lvl==1&&mTxt(u.base,r,(u.d+' '+u.sp).toLowerCase())));
  if(!exists&&(r.toks.length||r.mods.length)){out.push({s:'man',t:`${c.label} – check manually (no matching unit found)`,x:c.text});return}
  let lim=[],ok=true,val,txt;
  if(r.pct){val=dq?sq/dq*100:0;
   if(r.min!=null&&dq&&val<r.min-1e-6&&!(r.cond&&!sq))ok=false;if(r.max!=null&&val>r.max+1e-6)ok=false;
   txt=`${c.label}: ${sq}/${dq} = ${dq?Math.round(val):0}%`}
  else{val=sq;if(r.min!=null&&val<r.min&&t.n>0&&!(r.cond&&!sq))ok=false;if(r.max!=null&&val>r.max)ok=false;txt=`${c.label}: ${sq}`}
  out.push({s:t.n==0?'man':ok?'ok':'bad',t:txt,x:c.text})});
 return out}
/* ---------- unit limits ---------- */
function unitLimits(t){let out=[];
 A.U.forEach(u=>{if(!u.lim||u.lvl==2&&false)return;let q=t.by[u.id]||0;if(!q)return;let L=u.lim,max;
  if(L.div||L.ref)return;
  if(u.lvl==0){if(L.n=='half')return;max=L.n}
  else{let pq=t.by[(u.parent||u.base).id]||0;max=L.n=='half'?Math.floor(pq/2):L.n;
   if(q>pq)out.push({s:'bad',t:`${short(u)}: more upgrades (${q}) than units (${pq})`});}
  if(max!=null&&q>max)out.push({s:'bad',t:`${short(u)}: ${q} fielded, limit ${L.n=='half'?'half ('+max+')':max}`})});
 A.U.forEach(u=>{if(u.lvl&&!(u.lim&&u.lim.n==='half')){let q=t.by[u.id]||0,pq=t.by[(u.parent||u.base).id]||0;if(q>pq&&!(u.lim))out.push({s:'bad',t:`${short(u)}: more upgrades (${q}) than units (${pq})`})}});
 return out}
function short(u){return (u.lvl?'Upgrade: ':'')+u.d.replace(/ ?[–-] ?(up to|1 unit|only).*$/i,'').slice(0,70)}
/* ---------- render ---------- */
function stats(u){if(!u.st)return'as above';let s=u.st;return`C${s[0]} S${s[1]} SR${s[2]} LR${s[3]} Sv${s[4]} St${s[5]}`}
function render(){save();
 const dv=$('#divs');dv.innerHTML='';
 S.divs.forEach((d,di)=>{let box=document.createElement('div');box.className='card';
  let dt=tally([d]),nsk=0,sk=0,ninf=0;for(const[k,q]of Object.entries(d.q)){let u=A.U[k];if(u.lvl||u.sub)continue;if(u.cat=='skirmisher')sk+=q;else{nsk+=q;if(u.cat=='infantry')ninf+=q}}
  let h=`<div class="dh"><input type="text" value="${esc(d.name)}" data-n="${di}"><label><input type="radio" name="gen" ${S.gen==di?'checked':''} data-g="${di}"> General's division</label><b>${dt.pts} pts</b> · ${dt.n} units (${nsk} non-skirmisher, ${sk} skirmisher)<button data-rm="${di}" style="margin-left:auto">Remove</button></div>`;
  h+='<table><tr><th>Unit</th><th>Stats</th><th>Pts</th><th>Qty</th></tr>';
  A.U.forEach(u=>{let q=d.q[u.id]||0,vis=u.lvl==0||(d.q[(u.parent||u.base).id]||0)>0;if(!vis)return;
   let cls=u.lvl==0?'':u.lvl==1?'up':'up2',p=(u.pts>0&&u.lvl?'+':'')+(u.pts<0?'−'+(-u.pts):u.pts);
   h+=`<tr class="${cls}"><td>${esc(u.lvl?'• '+u.d:u.d)}${u.sp&&u.lvl==0?`<div class="sp">${esc(u.sp)}</div>`:''}${u.lvl&&u.sp?`<div class="sp">${esc(u.sp)}</div>`:''}${u.lim&&(u.lim.div||u.lim.ref)?`<div class="lim">Limit: ${u.lim.n} ${u.lim.div?'per division':'per '+esc(u.lim.ref)}</div>`:''}</td><td class="st">${stats(u)}</td><td>${p}</td><td class="q"><button data-d="${di}" data-u="${u.id}" data-a="-1">−</button><span>${q}</span><button data-d="${di}" data-u="${u.id}" data-a="1">+</button></td></tr>`});
  h+='</table>';box.innerHTML=h;dv.appendChild(box)});
 dv.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{let d=S.divs[+b.dataset.d],id=+b.dataset.u,u=A.U[id];d.q[id]=Math.max(0,(d.q[id]||0)+ +b.dataset.a);if(!d.q[id])delete d.q[id];
  if(u.lvl==0&&!d.q[id])A.U.forEach(x=>{if(x.lvl&&x.base==u)delete d.q[x.id]});
  A.U.forEach(x=>{if(x.lvl&&d.q[x.id]){let pq=d.q[(x.parent||x.base).id]||0;if(d.q[x.id]>pq){pq?d.q[x.id]=pq:delete d.q[x.id]}}});render()});
 dv.querySelectorAll('[data-n]').forEach(i=>i.onchange=()=>{S.divs[+i.dataset.n].name=i.value;save()});
 dv.querySelectorAll('[data-g]').forEach(i=>i.onchange=()=>{S.gen=+i.dataset.g;render()});
 dv.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{let i=+b.dataset.rm;S.divs.splice(i,1);if(S.gen>=S.divs.length)S.gen=Math.max(0,S.divs.length-1);render()});
 summary()}
function summary(){let t=tally(S.divs),lim=+$('#limit').value||0,V=[];
 let pc=lim?Math.min(100,t.pts/lim*100):0;
 $('#sum').innerHTML=`<h2>${esc(A.name)}</h2><div class="desc">${esc(A.date)}</div><p><b style="font-size:20px">${t.pts}</b> pts${lim?` / ${lim}`:''} · ${t.n} units · ${S.divs.length} divisions</p>${lim?`<div class="bar ${t.pts>lim?'over':''}"><i style="width:${pc}%"></i></div>`:''}<div class="desc" style="margin-top:6px">${CATS.filter(c=>t.cat[c]).map(c=>t.cat[c]+' '+c).join(' · ')||'No units yet'}</div>`;
 if(lim&&t.pts>lim)V.push({s:'bad',t:`Over points limit by ${t.pts-lim}`});
 // divisions
 S.divs.forEach((d,i)=>{let nsk=0,sk=0,all=0,ninf=0,per={};for(const[k,q]of Object.entries(d.q)){let u=A.U[k];if(u.lvl)continue;if(u.lim&&u.lim.div&&u.lim.n!='half')per[k]=q;if(u.sub)continue;all+=q;if(u.cat=='skirmisher')sk+=q;else{nsk+=q;if(u.cat=='infantry')ninf+=q}}
  if(!all)return;let nm=d.name||('Division '+(i+1)),sev=A.divEx?'warn':'bad',cnt=A.minExclSk?nsk:all;
  if(cnt<A.minDiv)V.push({s:sev,t:`${nm}: ${cnt} units, needs at least ${A.minDiv}${A.minExclSk?' (excluding skirmishers)':''}${A.divEx?' – unless an exception in the notes applies':''}`});
  if(A.skRatio!==Infinity&&sk>ninf*A.skRatio&&sk>0)V.push({s:A.divEx?'warn':'bad',t:`${nm}: ${sk} skirmishers but only ${ninf} non-skirmisher infantry (max ${A.skRatio*100}% of infantry)`});
  for(const[k,q]of Object.entries(per)){let u=A.U[k];if(q>u.lim.n)V.push({s:'bad',t:`${nm}: ${short(u)} – ${q}, limit ${u.lim.n} per division`})}
  A.U.forEach(u=>{if(u.lvl&&u.lim&&u.lim.div&&(d.q[u.id]||0)>u.lim.n)V.push({s:'bad',t:`${nm}: ${short(u)} – limit ${u.lim.n} per division`})})});
 if(!S.divs.length)V.push({s:'bad',t:'Army needs at least one division and a general'});
 else V.push({s:'ok',t:`Commanders: ${S.divs.length} free (one per division); "${esc(S.divs[S.gen]?.name||'')}" is the general's division`});
 V.push(...evalRules(t),...unitLimits(t));
 let bad=V.filter(v=>v.s=='bad').length,wr=V.filter(v=>v.s=='warn').length;
 $('#val').innerHTML=`<h2>Restrictions <span class="${bad?'bad':'ok'}">${bad?bad+' broken':'all met'}</span>${wr?` <span class="warn">${wr} to check</span>`:''}</h2><ul class="v">${V.map(v=>`<li class="${v.s}" title="${esc(v.x||'')}">${{ok:'✔',bad:'✘',warn:'⚠',man:'?'}[v.s]} ${v.t}${v.x?`<div class="desc">${esc(v.x)}</div>`:''}</li>`).join('')}</ul>`;
 $('#info').innerHTML=`<h2>Notes from the list</h2>${A.divRule?`<div class="desc"><b>Divisions:</b> ${esc(A.divRule.text)}</div>`:''}${A.skRule?`<div class="desc"><b>Skirmishers:</b> ${esc(A.skRule.text)}</div>`:''}<div class="desc"><b>Commanders:</b> ${esc(A.cmd)}</div><p class="desc">✔/✘ = checked automatically. ⚠ = division rule with a listed exception – verify. ? = needs manual check. Upgrade limits such as “up to half” are rounded down. Sub-units (e.g. elephant guards) are not counted as units. Hover rules for the original wording.</p>`}
function listText(){let t=tally(S.divs),s=`${A.name} – ${t.pts} pts, ${t.n} units\n`;S.divs.forEach((d,i)=>{s+=`\n${d.name||'Division '+(i+1)}${S.gen==i?' (General)':''}\n`;for(const[k,q]of Object.entries(d.q)){let u=A.U[k];s+=`  ${q} x ${u.lvl?'  + ':''}${u.d}\n`}});return s}
function printView(){let t=tally(S.divs),h=`<h1>${esc(A.name)}</h1><div>${esc(A.date)} · ${t.pts} pts · ${t.n} units · ${S.divs.length} division${S.divs.length==1?'':'s'}</div>`;
 S.divs.forEach((d,i)=>{let ks=Object.keys(d.q).map(Number).sort((a,b)=>a-b);if(!ks.length)return;let dt=tally([d]);
  h+=`<h2>${esc(d.name||'Division '+(i+1))}${S.gen==i?' (General)':''} – ${dt.pts} pts</h2><table><tr><th>Qty</th><th>Unit</th><th>Stats</th><th>Special</th><th>Pts</th></tr>`;
  ks.forEach(k=>{let u=A.U[k],q=d.q[k];h+=`<tr><td>${q}</td><td>${u.lvl?'&nbsp;&nbsp;+ ':''}${esc(u.d)}</td><td class="st">${stats(u)}</td><td>${esc(u.sp)}</td><td>${u.pts*q}</td></tr>`});h+='</table>'});
 if(!t.n)h+='<p>No units selected.</p>';$('#pv').innerHTML=h}
/* ---------- init ---------- */
ARMIES.forEach(a=>prep(a));
A=ARMIES[0];
const GR={};ARMIES.forEach((a,i)=>{let g=GR[a.group]||(GR[a.group]=Object.assign(document.createElement('optgroup'),{label:a.group}));if(!g.parentNode)$('#army').appendChild(g);let o=document.createElement('option');o.value=i;o.textContent=`${a.name} (${a.date})`;g.appendChild(o)});
function setArmy(i){A=ARMIES[i];A.rules=A.comp.map(parseRule).filter(Boolean);reset()}
$('#army').onchange=e=>setArmy(+e.target.value);
$('#limit').oninput=()=>summary();
$('#addDiv').onclick=()=>{let d=newDiv();d.name='Division '+(S.divs.length+1);S.divs.push(d);render()};
$('#clr').onclick=()=>{if(confirm('Clear the whole list?'))reset()};
$('#copy').onclick=()=>{navigator.clipboard.writeText(listText()).then(()=>alert('List copied'),()=>prompt('Copy:',listText()))};
$('#prt').onclick=()=>{printView();print()};window.addEventListener('beforeprint',printView);
setArmy(0);
</script></body></html>
